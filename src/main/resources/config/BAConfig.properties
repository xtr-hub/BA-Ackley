# BA算法核心参数配置
# 1. 频率范围上下限（单位：Hz 或 归一化值）
ba.frequency.min=0.0
ba.frequency.max=1.0

# 2. 响度衰减系数 a（通常 0.9~0.99）
ba.loudness.decay.a=0.95

# 3. 脉冲率增强系数 γ（通常 0.001~0.1）
ba.pulse.rate.gamma=0.01

# 4. 初始响度 a0（通常 0.5~2.0）
ba.loudness.initial.a0=1.0

# 5. 初始脉冲率 r0（通常 0.0~0.5）
ba.pulse.rate.initial.r0=0.1

# 6. 随机数种子（便于复现实验）
ba.random.seed=100

# 7. 最优集合的初始大小与种群的大小比例
ba.best.size=0.1